apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: compositegrappleapis.grsf.grpl.io
spec:
  scope: Cluster
  defaultCompositeDeletePolicy: Foreground
  group: grsf.grpl.io
  names:
    kind: CompositeGrappleApi
    plural: compositegrappleapis
    shortNames:
    - grapi
    - grapis
    - api
    - apis
    - grplapi
    - grplapis
    - grappleapi
    - grappleapis
    - xapi
    - xapis
    - xgrapi
    - xgrapis
    - xgrplapi
    - xgrplapis
    - xgrappleapi
    - xgrappleapis
  versions:
  - name: v1alpha2
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            description: Specification of the desired behavior of the grapple API (grapi). grapi.spec is the specification of the desired behavior of the grapple API.
            properties:
              name:
                description: "This field can be used to tweak the name of the grapi. \nIt is optional and shall only be used if required.\n(Default: \"\")\n"
                type: string
              writeConnectionSecretToRef:
                description: 'The secret to which this composite resource will write its connection details.

                  '
                type: object
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                  namespace:
                    description: Namespace of the secret.
                    type: string
                required:
                - name
                - namespace
              podAnnotations:
                description: 'Please specify here the annotations to be added to the pod template.

                  Used for Dapr sidecar injector annotations.

                  '
                type: object
                x-kubernetes-preserve-unknown-fields: true
              livenessProbe:
                description: 'Specify livenessProbe for the grapi container.

                  Verify against: kubectl explain pod.spec.containers.livenessProbe

                  '
                type: object
                x-kubernetes-preserve-unknown-fields: true
              readinessProbe:
                description: 'Specify readinessProbe for the grapi container.

                  Verify against: kubectl explain pod.spec.containers.readinessProbe

                  '
                type: object
                x-kubernetes-preserve-unknown-fields: true
              startupProbe:
                description: 'Specify startupProbe for the grapi container.

                  Verify against: kubectl explain pod.spec.containers.startupProbe

                  '
                type: object
                x-kubernetes-preserve-unknown-fields: true
              appVersion:
                description: 'Please specify here the version of the application (info.version in OpenAPI).

                  (Default: "")

                  '
                type: string
              asname:
                description: 'This field can be used to tweak the name of the parent gras (grapple ApplicationSet).

                  It is optional and shall only be used if required.

                  (Default: "")

                  '
                type: string
              organization:
                description: 'This field can be used to define the organization name displayed in the microservice.

                  This value may be derived from the cluster config.

                  (Default: "grapple solutions")

                  '
                type: string
              email:
                description: 'This field can be used to define the email address displayed in the microservice.

                  This value may be derived from the cluster config.

                  (Default: "info@grapple-solutions.com")

                  '
                type: string
              grapiversion:
                description: Please specify here the version of grapple API (grapi)
                type: string
              clusterdomain:
                description: "Please specify here the clusterdomain of the target cluster. \nonly use this field if not specified in the grapple config or the gras (grapple ApplicationSet).\n(Default: \"\" - usually defined in the grapple config secret)\n"
                type: string
              customheader:
                description: 'Please specify here the custom header content protecting the grapi (grapple API)

                  This value can be used to override the header specified in the gras (grapple ApplicationSet).

                  (Default: "")

                  '
                type: string
              dev:
                description: 'Please specify here if the DEV mode shall be activated for this grapi (grapple API)

                  this value can be used to override the header specified in the gras.

                  (Default: false)

                  '
                type: boolean
              ingress:
                description: 'Please specify here if ingress shall be enabled for the grapi (grapple API service)

                  (Default: true)

                  '
                type: boolean
              ssl:
                description: 'Please specify here if ssl shall be configured for the grapi (grapple API ingress)

                  (Default: false)

                  '
                type: boolean
              sslissuer:
                description: 'Please specify here the ssl issuer for the grapi (grapple API ingress)

                  (Default: "")

                  '
                type: string
              disableexplorer:
                description: 'Please specify "true" if you want to disable the explorer of the the grapi (grapple API) deployment

                  (Default: false)

                  '
                type: boolean
              corsurls:
                description: 'Please specify here the allowed cors urls for protecting the grapi (grapple API)

                  (e.g. "http://localhost:3000,http://localhost:2000")

                  (Default: "")

                  '
                type: string
              auth:
                description: 'Please define here the authenticatino settings for this grapi (grapple API)

                  '
                type: object
                properties:
                  basic:
                    description: 'Please define here the basic authenticatino settings for this grapi (grapple API)

                      LICENSE: Starter

                      '
                    type: object
                    properties:
                      config:
                        description: 'Please specify here if basic authentication config for the grapi (grapple API)

                          Example: ''{"auth": true, "writeonly": true, "exclude": "/invoices"}''

                          Requires ENV "Users" to exist - use "auth.basic.secretName" to create Users

                          LICENSE: Starter

                          '
                        type: string
                      secretName:
                        description: 'Please specify here secret containing basic authentication credentials for this grapi (grapple API)

                          Example: mysecret

                          Example: kubectl create secret generic authusers --from-literal Users=''[{"username": "grapple", "email": "info@grapple-solutions.com", "password": "mysecretpw", "realm": "random"}, {"username": "sales", "email": "sales@grapple-solutions.com", "password": "mysalespw", "realm": "random"}]''

                          LICENSE: Starter

                          '
                        type: string
                  profile:
                    description: 'Please define here the basic authenticatino settings for this grapi (grapple API)

                      LICENSE: Pro

                      (TODO: NOT YET IMPLEMENTED)

                      '
                    type: object
                    properties:
                      profile:
                        type: string
                        description: 'Please define here the authentication profile for this grapi (grapple API)

                          LICENSE: Pro

                          (TODO: NOT YET IMPLEMENTED)

                          '
                      settings:
                        type: string
                        description: 'Please define here the authentication profile settings for this grapi (grapple API)

                          LICENSE: Pro

                          (TODO: NOT YET IMPLEMENTED)

                          '
              buildimages:
                description: 'Build image configuration. Set enabled=true to build images for grapi.

                  buildimages.tag is MANDATORY when enabled=true.

                  '
                type: object
                properties:
                  enabled:
                    description: 'Set to true to build images for grapi (grapple API). (Default: false)

                      '
                    type: boolean
                  tag:
                    description: 'Image tag for built images. MANDATORY when enabled=true.

                      (Default: "")

                      '
                    type: string
                  name:
                    description: 'Image name for built images.

                      Falls back to local registry naming convention if not specified.

                      (Default: "")

                      '
                    type: string
                  resources:
                    description: 'Resource definitions for the build job container.

                      Default: requests 2Gi/500m, limits 4Gi/2cpu

                      '
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  resourcesNpmMem:
                    description: 'Node.js max_old_space_size for the build job (in MB).

                      Should be <75% of memory limit. Default: 3072 (75% of 4Gi)

                      '
                    type: string
                  cache:
                    description: 'Shall a cache be used for building the images for this grapi (grapple API)?

                      (Default: true)

                      '
                    type: boolean
                    default: true
              runimages:
                description: 'Runtime image configuration. Used when runimages.enabled=true (default).

                  image and tag are also used as the base image when buildimages.enabled=true.

                  '
                type: object
                properties:
                  enabled:
                    description: 'Shall the runtime image be deployed? (Default: true)

                      '
                    type: boolean
                  image:
                    description: 'Runtime/base image name.

                      Used as: (1) Base image when buildimages.enabled=true

                      (2) Runtime image when buildimages.enabled=false and deployimages.enabled=false

                      (Default: grpl/grapi)

                      '
                    type: string
                  tag:
                    description: 'Tag for the runtime/base image.

                      (Default: grapiversion)

                      '
                    type: string
                  resources:
                    description: 'Resource definitions for the runtime container.

                      Default: requests 256Mi/250m, limits 3Gi/4000m

                      '
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  resourcesNpmMem:
                    description: 'Node.js max_old_space_size for the runtime container (in MB).

                      Should be <75% of memory limit. Default: 2048 (75% of ~2.7Gi)

                      '
                    type: string
              deployimages:
                description: 'Deploy pre-built image configuration.

                  deployimages.name and deployimages.tag are MANDATORY when enabled=true and buildimages.enabled=false.

                  '
                type: object
                properties:
                  enabled:
                    description: 'Shall the pre-built image be deployed? (Default: false)

                      '
                    type: boolean
                  name:
                    description: 'Pre-built image name to deploy.

                      MANDATORY when enabled=true and buildimages.enabled=false.

                      (Default: "")

                      '
                    type: string
                  tag:
                    description: 'Pre-built image tag to deploy.

                      MANDATORY when enabled=true and buildimages.enabled=false.

                      (Default: "")

                      '
                    type: string
                  resources:
                    description: 'Resource definitions for the deployed image container.

                      Default: requests 256Mi/250m, limits 1Gi/2cpu

                      '
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  resourcesNpmMem:
                    description: 'Node.js max_old_space_size for the deployed image container (in MB).

                      Should be <75% of memory limit. Default: 768 (75% of 1Gi)

                      '
                    type: string
              autoscaling:
                description: 'Please define here the scaling definitions for this grapi (grapple API)

                  '
                type: object
                properties:
                  replicas:
                    description: 'Please specify the number of replicas for the resources in this grapi (grapple API)

                      Default: 1

                      '
                    type: integer
                  minReplicas:
                    description: 'Please specify the minimum number of replicas for the resources in this grapi (grapple API)

                      Default: 1

                      '
                    type: integer
                  maxReplicas:
                    description: 'Please specify the maximum number of replicas for the resources in this grapi (grapple API)

                      Default: 20

                      '
                    type: integer
                  targetCPUUtilizationPercentage:
                    description: 'Please specify the targetCPUUtilizationPercentage for the resources in this grapi (grapple API)

                      Default: 60

                      '
                    type: integer
              graphql:
                description: 'Please specify whether to deploy a graphql interface for the grapi (grapple API)?

                  (Default: false)

                  '
                type: boolean
              monitoring:
                description: 'Please specify whether the extended monitoring endpoint should be enabled for this grapi (grapple API)?

                  (Default: true)

                  '
                type: boolean
              discoveredrepos:
                description: 'Please specify whether to automatically discover the repositories for the models in this grapi (grapple API)?

                  (Default: true)

                  '
                type: boolean
              externalsecrets:
                description: "Please add here the externalsecrets for this grapi (grapple API)\nyou can attach multiple externalsecrets specifications to your grapi (grapple API)\nall variables in the secret become available to the grapi (grapple API):\nhttps://external-secrets.io/\nexample:\n  externalsecrets:\n  - name: classicmodelsas-auroramysql\n    spec:\n      refreshInterval: 1h\n      secretStoreRef:\n        name: aws-secretstore\n        kind: ClusterSecretStore\n      target:\n        name: mytarget\n        creationPolicy: Owner\n      dataFrom:\n      - extract:\n          key: \"mysecret\"\n"
                type: array
                items:
                  type: object
                  properties:
                    name:
                      description: please specify the name for the externalsecrets object
                      type: string
                    spec:
                      description: 'Please specify the spec for the externalsecrets

                        verify against:

                        kubectl explain externalsecrets.spec

                        https://external-secrets.io/

                        '
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
              extraSecrets:
                description: "Please add here the extraSecrets for this grapi (grapple API)\nyou can just reference the name of a secret and all parameters \nbecome available inside the grapi (grapple API) deployment as variables\n"
                type: array
                items:
                  type: string
              automigrate:
                description: "Please specify whether to automatically migrate the datasource in this grapi (grapple API)? \nruns: \"npm run migrate\"\nfurther information:\nhttps://loopback.io/doc/en/lb4/Database-migrations.html\n"
                type: boolean
              autorestartgruim:
                description: "auto-restart the gruim (grapple UI module) on a change in the grapi (grapple API) spec \nusing a kubernetes cronjob?\n(Default: false)\n"
                type: boolean
                default: false
              schedule:
                description: 'cron schedule for the openapi check (e.g. */10 * * * *)

                  '
                type: string
              env:
                description: "Please add here the environment variables for this grapi (grapple API).\nAll variables here become available to all containers (main and init).\nDocumentation: https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/\nExample:\nenv:\n- name: MY_VARIABLE\n  value: \"my-value\"\n- name: DB_PASSWORD\n  valueFrom:\n    secretKeyRef:\n      name: database-secret\n      key: password\n"
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    value:
                      type: string
                    valueFrom:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
              initContainers:
                description: "specify initContainers that shall run successfully before starting the grapi (grapple API)\nexample:\n  initContainers:\n  - name: init-db\n    spec:\n      command:\n      - bash\n      - -c\n      - sleep 5; COMMAND_TO_EXECUTE\n      image: mysql\n      name: init-db\n"
                type: array
                items:
                  type: object
                  properties:
                    name:
                      description: please specify the name for the initContainer
                      type: string
                    spec:
                      description: 'please specify the spec for the grapi (grapple API) initContainer

                        verify against:

                        kubectl explain pod.spec.initContainers

                        '
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
              volumes:
                description: "Specify additional volumes that shall be attached to the grapi (grapple API)\nverify against: \nkubectl explain pod.spec.volumes\n"
                type: array
                items:
                  description: 'please specify the spec for the grapi (grapple API) volumes

                    verify against:

                    kubectl explain pod.spec.volumes

                    '
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              volumeMounts:
                description: 'specify volumeMounts that shall be mounted to the grapi (grapple API)

                  verify against:

                  kubectl explain pod.spec.containers.volumeMounts

                  '
                type: array
                items:
                  description: 'please specify the spec for the grapi (grapple API) volumeMounts

                    verify against:

                    kubectl explain pod.spec.containers.volumeMounts

                    '
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              datasources:
                description: 'Please add here all the datasources that shall be deployed within this grapi (grapple API)

                  further information:

                  https://loopback.io/doc/en/lb4/DataSource-generator.html

                  '
                type: array
                items:
                  type: object
                  properties:
                    name:
                      description: please specify the name for the datasource
                      type: string
                    content:
                      description: 'please specify the content for the datasource in form of a json string

                        example:

                        {"name":"classicmodels","connector":"mysql","url":"","host":"DBHOST","port":"DBPORT","user":"DBUSER","password":"DBPW","database":"DBSCHEMA"}

                        or use the spec for yaml format

                        '
                      type: string
                    spec:
                      type: object
                      properties:
                        force:
                          description: Force overwrite if datasource already exists
                          type: boolean
                          default: true
                        mysql:
                          description: Please specify the specs for datasource type mysql
                          type: object
                          properties:
                            force:
                              description: Force overwrite if datasource already exists
                              type: boolean
                              default: true
                            name:
                              description: Please provide a name for the datasource
                              type: string
                            connector:
                              description: 'Please provide the connector type for the datasource - Default: mysql'
                              type: string
                              default: mysql
                            database:
                              description: Spec for database for datasource mysql
                              type: string
                            host:
                              description: Spec for host for datasource mysql
                              type: string
                            password:
                              description: Spec for password for datasource mysql
                              type: string
                            port:
                              description: Spec for port for datasource mysql
                              type: string
                            url:
                              description: Spec for url for datasource mysql
                              type: string
                            user:
                              description: Spec for user for datasource mysql
                              type: string
                        postgresql:
                          description: Please specify the specs for datasource type postgresql
                          type: object
                          properties:
                            force:
                              description: Force overwrite if datasource already exists
                              type: boolean
                              default: true
                            name:
                              description: Please provide a name for the datasource
                              type: string
                            connector:
                              description: 'Please provide the connector type for the datasource - Default: postgresql'
                              type: string
                              default: postgresql
                            database:
                              description: Spec for database for datasource postgresql
                              type: string
                            host:
                              description: Spec for host for datasource postgresql
                              type: string
                            password:
                              description: Spec for password for datasource postgresql
                              type: string
                            port:
                              description: Spec for port for datasource postgresql
                              type: string
                            url:
                              description: Spec for url for datasource postgresql
                              type: string
                            user:
                              description: Spec for user for datasource postgresql
                              type: string
                        kv-redis:
                          description: Please specify the specs for datasource type kv-redis
                          type: object
                          properties:
                            force:
                              description: Force overwrite if datasource already exists
                              type: boolean
                              default: true
                            name:
                              description: Please provide a name for the datasource
                              type: string
                            connector:
                              description: 'Please provide the connector type for the datasource - Default: kv-redis'
                              type: string
                              default: kv-redis
                            db:
                              description: Spec for db for datasource kv-redis
                              type: string
                            host:
                              description: Spec for host for datasource kv-redis
                              type: string
                            password:
                              description: Spec for password for datasource kv-redis
                              type: string
                            port:
                              description: Spec for port for datasource kv-redis
                              type: string
                            url:
                              description: Spec for url for datasource kv-redis
                              type: string
                        kv-memory:
                          description: Please specify the specs for datasource type kv-memory
                          type: object
                          properties:
                            force:
                              description: Force overwrite if datasource already exists
                              type: boolean
                              default: true
                            name:
                              description: Please provide a name for the datasource
                              type: string
                            connector:
                              description: 'Please provide the connector type for the datasource - Default: kv-memory'
                              type: string
                              default: kv-memory
                        memory:
                          description: Please specify the specs for datasource type memory
                          type: object
                          properties:
                            force:
                              description: Force overwrite if datasource already exists
                              type: boolean
                              default: true
                            name:
                              description: Please provide a name for the datasource
                              type: string
                            connector:
                              description: 'Please provide the connector type for the datasource - Default: memory'
                              type: string
                              default: memory
                            file:
                              description: Spec for file for datasource memory
                              type: string
                            localStorage:
                              description: Spec for localStorage for datasource memory
                              type: string
              discoveries:
                description: 'Please add here all the discoveries that shall be executed within this grapi (grapple API)

                  further information:

                  https://loopback.io/doc/en/lb4/Discovering-models.html

                  '
                type: array
                items:
                  type: object
                  properties:
                    name:
                      description: please specify the name for the discovery
                      type: string
                    content:
                      description: 'please specify the content for the discovery in form of a json string

                        example:

                        {"dataSource":"classicmodels","schema":"DBSCHEMA","all":"true","disableCamelCase":false,"yes":"undefined"}

                        or use the spec for yaml format

                        '
                      type: string
                    spec:
                      type: object
                      properties:
                        dataSource:
                          description: The name of the datasource to discover
                          type: string
                        datasource:
                          description: The name of the datasource to discover (alias for dataSource)
                          type: string
                        force:
                          description: Force overwrite if discovery already exists
                          type: boolean
                          default: true
                        views:
                          description: Boolean to discover views
                          type: boolean
                        relations:
                          description: Discover and create relations
                          type: boolean
                        schema:
                          description: Schema to discover
                          type: string
                        all:
                          description: Discover all models without prompting users to select
                          type: boolean
                        outDir:
                          description: Specify the directory into which the `model.model.ts` files will be placed
                          type: string
                        models:
                          description: Discover specific models without prompting users to select e.g:--models=table1,table2
                          type: string
                        optionalId:
                          description: Boolean to mark id property as optional field
                          type: boolean
                        disableCamelCase:
                          description: disableCamelCase
                          type: boolean
              models:
                description: 'Please add here all the models that shall be deployed within this grapi (grapple API)

                  further information:

                  https://loopback.io/doc/en/lb4/Model-generator.html

                  '
                type: array
                items:
                  type: object
                  properties:
                    name:
                      description: please specify the name for the model
                      type: string
                    content:
                      description: 'please specify the content for the models in form of a json string

                        example:

                        {"base":"Entity","name":"customer","properties":{"id":{"type":"number","id":true,"required":true,"generated":true},"customername":{"type":"string"},"emaildomain":{"type":"string","required":true},"datecreated":{"type":"date","required":false},"datelastupdated":{"type":"date","required":false}}}

                        or use the spec for yaml format

                        '
                      type: string
                    spec:
                      type: object
                      properties:
                        base:
                          description: A valid based model
                          type: string
                        dataSource:
                          description: The name of the dataSource which contains this model and suppots model discovery
                          type: string
                        datasource:
                          description: The name of the dataSource which contains this model and supports model discovery (alias for dataSource)
                          type: string
                        allowAdditionalProperties:
                          description: Allow additional properties on the model (default false)
                          type: boolean
                          default: false
                        force:
                          description: Force overwrite if model already exists
                          type: boolean
                          default: true
                        table:
                          description: If discovering a model from a dataSource, specify the name of its table/view
                          type: string
                        schema:
                          description: If discovering a model from a dataSource, specify the schema which contains it
                          type: string
                        name:
                          description: name
                          type: string
                        properties:
                          description: properties
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              type:
                                description: Please define the type of the field (e.g. 'string', 'array', 'number')
                                type: string
                              itemType:
                                description: Please define the type of the item if type = array (e.g. 'string', 'number')
                                type: string
                              id:
                                description: Please define if the field is an ID (unique identifier for this model)
                                type: boolean
                              generated:
                                description: Please define, if the field is autogenerated by the underlying system (e.g. database) (boolean, e.g. true / false) (false, if defaultFn is defined)
                                type: boolean
                              required:
                                description: Please define whether the field is required (boolean, e.g. true / false) (if the field is generated, it is NOT required)
                                type: boolean
                              default:
                                description: Please define the default value for the field (e.g. 'myvalue')
                                type: string
                              length:
                                description: Please define the length of the field (e.g. 20 (for 20 characters))
                                x-kubernetes-int-or-string: true
                              defaultFn:
                                description: Please define the default function for the field (e.g. 'uuid' (for ID string fields), 'now' (for date fields))
                                type: string
              relations:
                description: 'Please add here all the relations that shall be deployed within this grapi (grapple API)

                  further information:

                  https://loopback.io/doc/en/lb4/Relation-generator.html

                  '
                type: array
                items:
                  type: object
                  properties:
                    name:
                      description: please specify the name for the relation
                      type: string
                    content:
                      description: 'please specify the content for the relation in form of a json string

                        example:

                        {"destinationModel":"Employees","foreignKeyName":"employeesId","registerInclusionResolver":true,"relationName":"employees","relationType":"belongsTo","sourceModel":"Customers"}

                        or use the spec for yaml format

                        '
                      type: string
                    spec:
                      type: object
                      properties:
                        relationType:
                          description: Relation type
                          type: string
                        sourceModel:
                          description: Source model
                          type: string
                        customReferenceKeys:
                          description: Destination model key or boolean flag
                          x-kubernetes-preserve-unknown-fields: true
                        customSourceModelKey:
                          description: Custom source model key name
                          type: string
                        customTargetModelKey:
                          description: Custom target model key name
                          type: string
                        force:
                          description: Force overwrite if relation already exists
                          type: boolean
                          default: true
                        destinationModel:
                          description: Destination model key
                          type: string
                        throughModel:
                          description: Through model
                          type: string
                        sourceModelPrimaryKey:
                          description: Primary key on source model
                          type: string
                        sourceModelPrimaryKeyType:
                          description: Type of the primary key on source model
                          type: string
                        destinationModelPrimaryKey:
                          description: Primary key on destination model
                          type: string
                        destinationModelPrimaryKeyType:
