apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: compositegrappleapplicationsets.grsf.grpl.io
spec:
  defaultCompositeDeletePolicy: Foreground
  claimNames:
    kind: GrappleApplicationSet
    plural: grappleapplicationsets
    shortNames:
    - as
    - applicationset
    - gras
    - grplas
    - grappleas
    - grapplicationset
    - grplapplicationset
    - grappleapplicationset
    - grapplicationsets
    - grplapplicationsets
    - grappleapplicationsets
  group: grsf.grpl.io
  names:
    kind: CompositeGrappleApplicationSet
    plural: compositegrappleapplicationsets
    shortNames:
    - xas
    - xapplicationset
    - xgras
    - xgrplas
    - xgrappleas
    - xgrapplicationset
    - xgrplapplicationset
    - xgrappleapplicationset
    - xgrapplicationsets
    - xgrplapplicationsets
    - xgrappleapplicationsets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: |
                  Specification of the desired behavior of the grapple ApplicationSet (gras). 
                  gras.spec is the specification of the desired behavior of the ApplicationSet.
              properties:
                name:
                  description: |
                    This field can be used to tweak the name of the gras.
                    It is optional and shall only be used if required. 
                    Default: ""
                  type: string
                asname:
                  description: | 
                    This field can be used to tweak the name of the parent gras (grapple ApplicationSet). 
                    It is optional and shall only be used if required.
                    (Default: "")
                  type: string
                grasversion:
                  description: 'Please specify here the version of the gras (grapple ApplicationSet)'
                  type: string
                clusterdomain:
                  description: 'Please specify here the clusterdomain of the target cluster - only use this field if not specified in the grapple config or the gras.'
                  type: string
                customheader:
                  description: | 
                    Please specify here the custom header content protecting the gras (grapple ApplicationSet) 
                    (Default: "")
                  type: string
                dev:
                  description: |
                    Please specify here if the DEV mode shall be activated for the whole gras (grapple ApplicationSet)
                    (Default: false)
                  type: boolean
                ingress:
                  description: 'Please specify here if ingress shall be enabled for the whole gras (grapple ApplicationSet) (Default: false)'
                  type: boolean
                ssl:
                  description: 'Please specify here if ssl shall be configured for the whole gras (grapple ApplicationSet) (Default: false)'
                  type: boolean
                sslissuer:
                  description: 'Please specify here the ssl issuer for the whole gras (grapple ApplicationSet) (Default: "")'
                  type: string
                autoscaling:
                  description: | 
                    Please define here the scaling definitions for this gras (grapple ApplicationSet)
                  type: object
                  properties:
                    replicas:
                      description: | 
                        Please specify the number of replicas for the resources in this gras (grapple ApplicationSet)
                        Default: 1
                      type: integer
                    minReplicas:
                      description: | 
                        Please specify the minimum number of replicas for the resources in this gras (grapple ApplicationSet)
                        Default: 1
                      type: integer
                    maxReplicas:
                      description: | 
                        Please specify the maximum number of replicas for the resources in this gras (grapple ApplicationSet)
                        Default: 20
                      type: integer
                    targetCPUUtilizationPercentage:
                      description: | 
                        Please specify the targetCPUUtilizationPercentage for the resources in this gras (grapple ApplicationSet)
                        Default: 60
                      type: integer
                    targetMemoryUtilizationPercentage:
                      description: | 
                        Please specify the targetMemoryUtilizationPercentage for the resources in this gras (grapple ApplicationSet)
                        Default: undefined
                      type: integer
                resources:
                  description: | 
                    Please add here the resource definitions for this gras (grapple ApplicationSet)
                  type: object
                  properties:
                    runimages:
                      description: | 
                        Please specify the resource definitions for the resources in this gras (grapple ApplicationSet) in runimages mode
                        runimages mode builds the deployment and requires more resources
                      type: object
                      properties:
                        spec:
                          description: |
                            Please specify resource definitions for the resources in this gras (grapple ApplicationSet) in runimages mode
                            verify against "kubectl explain pod.spec.containers.resources"
                            example/default:
                              resources:
                                requests:
                                  memory: "256Mi"
                                  cpu: "250m"
                                limits:
                                  # when changing memory here, please consider also chaning max_old_space_size in env of be deployment.
                                  memory: "2Gi"
                                  cpu: "3000m"
                          type: object
                          # allows to specify anything in the object... no verification whatsoever...
                          x-kubernetes-preserve-unknown-fields: true
                    deployimages:
                      description: | 
                        Please specify the resource definitions for the resources in this gras (grapple ApplicationSet) in deployimages mode
                        deployimages mode deploys the pre-baked images requires therefore less resources
                      type: object
                      properties:
                        spec:
                          description: |
                            Please specify resource definitions for the resources in this gras (grapple ApplicationSet) in deployimages mode
                            verify against "kubectl explain pod.spec.containers.resources"
                            example/default:
                              resources:
                                requests:
                                  memory: "256Mi"
                                  cpu: "250m"
                                limits:
                                  # when changing memory here, please consider also chaning max_old_space_size in env of be deployment.
                                  memory: "1024Mi"
                                  cpu: "2000m"
                          type: object
                          # allows to specify anything in the object... no verification whatsoever...
                          x-kubernetes-preserve-unknown-fields: true
                mcpConfigs:
                  description: |
                    Set on the gras (grapple ApplicationSet), this is the default for every grapi in grapis;
                    a grapi that sets its own mcpConfigs/aiConfigs in grapis[].spec keeps its own value.
                    MCP (Model Context Protocol) servers exposed by this grapi (grapple API) at /mcp/<server>.
                    A map of server name -> server config, written as plain YAML.
                    The chart renders it as JSON into the MCP_CONFIGS env var. Empty or unset -> MCP_CONFIGS not set (default behaviour).
                    Example:
                      mcpConfigs:
                        dat-search:
                          enable: true
                          auth: true
                          permissions: ["dat:read"]
                          defaultInclude: ["search*", "find*"]
                          roleBased:
                            admin:
                              include: ["*"]
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      enable:
                        description: Whether this MCP server is enabled (served at /mcp/<server>).
                        type: boolean
                      auth:
                        description: Whether calls to this MCP server require an authenticated user (bearer token).
                        type: boolean
                      permissions:
                        description: Permissions the caller must have to use this MCP server.
                        type: array
                        items:
                          type: string
                      defaultInclude:
                        description: |
                          Tools included by default (for callers without a matching roleBased entry).
                          A string (comma-separated patterns, e.g. "search*,find*") or a list of patterns
                          (e.g. ["search*", "find*"]); a list is joined with "," by the chart.
                        x-kubernetes-preserve-unknown-fields: true
                      defaultExclude:
                        description: |
                          Tools excluded by default (for callers without a matching roleBased entry).
                          A string (comma-separated patterns) or a list of patterns; a list is joined with "," by the chart.
                        x-kubernetes-preserve-unknown-fields: true
                      roleBased:
                        description: |
                          Per-role tool filters: a map of role name -> include/exclude tool patterns.
                          A caller with a listed role gets that role's filter instead of defaultInclude/defaultExclude.
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            include:
                              description: Tool name patterns included for this role.
                              type: array
                              items:
                                type: string
                            exclude:
                              description: Tool name patterns excluded for this role.
                              type: array
                              items:
                                type: string
                aiConfigs:
                  description: |
                    Set on the gras (grapple ApplicationSet), this is the default for every grapi in grapis;
                    a grapi that sets its own mcpConfigs/aiConfigs in grapis[].spec keeps its own value.
                    AI configurations served by this grapi (grapple API) and read by the gruim (grapple UI module) via /api.
                    Written as plain YAML; the chart renders it as JSON into the AI_CONFIGS env var.
                    Empty or unset -> AI_CONFIGS not set (default behaviour).
                    API keys never go into this claim: put them in a secret, reference that secret in extraSecrets
                    and set apiKeyEnv to the name of the env var that holds the key (e.g. GOOGLE_API_KEY).
                    Example:
                      aiConfigs:
                        ai-chat:
                          catalogue:
                            mode: managed
                            provider: google
                            model: gemini-2.5-flash
                            apiKeyEnv: GOOGLE_API_KEY
                  type: object
                  properties:
                    ai-chat:
                      description: AI chat configurations, a map of config key -> config.
                      type: object
                      additionalProperties:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        properties:
                          mode:
                            description: |
                              byok: the user brings their own API key (entered in the gruim).
                              managed: grapi calls the provider with the key from apiKeyEnv.
                            type: string
                            enum: ["byok", "managed"]
                          provider:
                            description: The AI provider.
                            type: string
                            enum: ["google", "anthropic", "openai"]
                          model:
                            description: The default model of the provider (e.g. gemini-2.5-flash).
                            type: string
                          models:
                            description: Models the user may choose from.
                            type: array
                            items:
                              type: string
                          apiKeyEnv:
                            description: |
                              NAME of the env var in the grapi deployment that holds the provider API key (e.g. GOOGLE_API_KEY).
                              Never the key itself; provide the key through a secret listed in extraSecrets.
                            type: string
                    ai-drilldown:
                      description: AI drilldown configurations, a map of config key -> config.
                      type: object
                      additionalProperties:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        properties:
                          mode:
                            description: |
                              byok: the user brings their own API key (entered in the gruim).
                              managed: grapi calls the provider with the key from apiKeyEnv.
                            type: string
                            enum: ["byok", "managed"]
                          provider:
                            description: The AI provider.
                            type: string
                            enum: ["google", "anthropic", "openai"]
                          model:
                            description: The default model of the provider (e.g. gemini-2.5-flash).
                            type: string
                          models:
                            description: Models the user may choose from.
                            type: array
                            items:
                              type: string
                          apiKeyEnv:
                            description: |
                              NAME of the env var in the grapi deployment that holds the provider API key (e.g. GOOGLE_API_KEY).
                              Never the key itself; provide the key through a secret listed in extraSecrets.
                            type: string
                grapis:
                  description: | 
                    Please add here the grapis (grapple APIs) 
                    for this gras (grapple ApplicationSet)
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        description: please specify the name for the grapi (grapple API)
                        type: string
                      spec:
                        description: |
                          please specify the spec for the grapi (grapple API)
                          verify against "kubectl explain grapi.spec"
                        type: object
                        # allows to specify anything in the object... no verification whatsoever...
                        x-kubernetes-preserve-unknown-fields: true  
                gruims:
                  description: | 
                    Please add here the gruims (grapple UI modules) 
                    for this gras (grapple ApplicationSet)
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        description: please specify the name for the gruim (grapple UI module)
                        type: string
                      spec:
                        description: | 
                          please specify the spec for the gruim (grapple UI module)
                          verify against "kubectl explain gruim.spec"
                        type: object
                        # allows to specify anything in the object... no verification whatsoever...
                        x-kubernetes-preserve-unknown-fields: true  