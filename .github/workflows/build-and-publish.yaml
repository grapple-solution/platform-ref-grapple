name: Build and Publish

on:
  pull_request:
    branches:
      - feature/grapi
  push:
    branches:
      - feature/grapi
  workflow_dispatch: {}

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install required tools
        run: |
          task install-tools

      - name: Determine stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "stage=pr" >> $GITHUB_OUTPUT
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "Building and publishing for Pull Request"
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "stage=prd" >> $GITHUB_OUTPUT
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "Building for feature/grapi branch (will publish)"
          else
            echo "stage=dev" >> $GITHUB_OUTPUT
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "Manual workflow dispatch (will publish)"
          fi

      - name: Display build info
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          task info STAGE=${{ steps.stage.outputs.stage }}

      - name: Ensure required images are available
        run: |
          echo "Checking for required images (grapi and gruim)..."
          task ensure-images

      - name: Build package
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Building package for stage: ${{ steps.stage.outputs.stage }}"
          task build STAGE=${{ steps.stage.outputs.stage }}

      - name: Publish package
        if: success() && steps.stage.outputs.should_publish == 'true'
        run: |
          echo "Publishing package for stage: ${{ steps.stage.outputs.stage }}"
          task publish STAGE=${{ steps.stage.outputs.stage }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ steps.stage.outputs.stage }}-${{ github.run_number }}
          path: |
            target/*.xpkg
            version.txt
          retention-days: 30

      - name: Create build summary
        if: success()
        run: |
          VERSION=$(cat version.txt)
          GIT_HASH=$(git log -n 1 --format=%h)
          STAGE=${{ steps.stage.outputs.stage }}
          
          if [ "$STAGE" = "prd" ]; then
            TAG="${VERSION}"
          elif [ "$STAGE" = "pr" ]; then
            PR_NR="${{ github.event.pull_request.number }}"
            TAG="${VERSION}.pr-${PR_NR}"
          else
            TAG="${VERSION}.${STAGE}-${GIT_HASH}"
          fi
          
          echo "## Build Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Stage:** \`${STAGE}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`grpl/grsf:${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${GITHUB_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.stage.outputs.should_publish }}" = "true" ]; then
            echo "Package built and **published** successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Install" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "kubectl crossplane install configuration grpl/grsf:${TAG}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "Package built successfully (not published for PRs)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Bump version on merge
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feature/grapi'
        run: |
          # Read current version
          CURRENT_VERSION=$(cat version.txt | tr -d '[:space:]')
          echo "Current version: ${CURRENT_VERSION}"
          
          # Split the version into major, minor, and patch components
          IFS='.' read -r major minor patch <<< "${CURRENT_VERSION}"
          
          # Increment the patch version
          patch=$((patch + 1))
          
          # If patch reaches 100, reset to 0 and increment minor version
          if [ "$patch" -ge 100 ]; then
            patch=0
            minor=$((minor + 1))
          fi
          
          # If minor reaches 100, reset to 0 and increment major version
          if [ "$minor" -ge 100 ]; then
            minor=0
            major=$((major + 1))
          fi
          
          NEW_VERSION="${major}.${minor}.${patch}"
          echo "New version: ${NEW_VERSION}"
          
          # Write new version to file
          echo "${NEW_VERSION}" > version.txt
          
          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if there are changes to commit
          if git diff --quiet version.txt; then
            echo "No version change detected, skipping commit"
            exit 0
          fi
          
          # Commit and push the version bump
          git add version.txt
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push
          
          echo "Version bumped from ${CURRENT_VERSION} to ${NEW_VERSION}"
