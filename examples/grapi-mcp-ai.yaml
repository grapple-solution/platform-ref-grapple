# GrappleApi claim with MCP servers and AI configs (DAT-like values).
# mcpConfigs / aiConfigs are plain YAML; the grapi chart renders them as JSON into MCP_CONFIGS / AI_CONFIGS.
# 2+ enabled MCP servers -> grapi also serves /mcp/all (all tools, named <server>__<tool>).
# API keys never go into the claim: the secret "dat-ai-keys" (with key GOOGLE_API_KEY) is mounted via
# extraSecrets, and apiKeyEnv only names the env var.
apiVersion: grsf.grpl.io/v1alpha1
kind: GrappleApi
metadata:
  name: dat
spec:
  name: dat
  extraSecrets:
  - dat-ai-keys
  mcpConfigs:
    dat-search:
      enable: true
      defaultInclude:
      - GET:dsearchtree/drilldowns/vehicle
      - GET:dsearchtree/drilldowns/vehicle/*
      - GET:dsearchtree/datecode2s/count
    dat-admin:
      enable: true
      auth: true
      permissions:
      - admin
      defaultExclude: "DELETE:*"
      roleBased:
        viewer:
          include:
          - GET:*
  aiConfigs:
    vehicle:                    # type drilldown: the key is the drilldown name
      type: drilldown
      mode: managed
      provider: google
      model: gemini-2.5-flash
      apiKeyEnv: GOOGLE_API_KEY
      mcps:
      - dat-search
      guidelines: |
        DAT vehicle catalogue (table datecode2). Labels are German.
      maxSteps: 10
      thinkingBudget: 512
    catalogue:                  # chat, bring your own key (defaults)
      mcps:
      - dat-search
      - https://external-domain.com/mcp
      guidelines: You help users search the DAT vehicle catalogue.
