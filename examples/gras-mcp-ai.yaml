# GrappleApplicationSet: mcpConfigs / aiConfigs set on the gras are the default for every grapi in grapis.
# A grapi that sets its own mcpConfigs / aiConfigs in grapis[].spec keeps its own value.
apiVersion: grsf.grpl.io/v1alpha1
kind: GrappleApplicationSet
metadata:
  name: dat
spec:
  mcpConfigs:
    dat-search:
      enable: true
      defaultInclude:
      - GET:dsearchtree/drilldowns/vehicle
      - GET:dsearchtree/drilldowns/vehicle/*
  aiConfigs:
    vehicle:
      type: drilldown
      mode: managed
      provider: google
      model: gemini-2.5-flash
      apiKeyEnv: GOOGLE_API_KEY
      mcps:
      - dat-search
  grapis:
  - name: grapi
    spec:
      extraSecrets:
      - dat-ai-keys
  gruims:
  - name: gruim
    spec: {}
